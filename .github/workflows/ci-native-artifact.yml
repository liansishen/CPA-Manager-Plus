name: CI Native Artifact

on:
  push:
    branches:
      - 'chore/sync-upstream-*'
      - 'feat/**'
      - 'fix/**'
      - 'main'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build'
        required: false
        default: main
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build native packages and management artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.24.x'
          cache-dependency-path: apps/manager-server/go.sum

      - name: Install dependencies
        run: npm ci

      - name: Check demo isolation
        run: npm run check:demo-isolation

      - name: Build management HTML
        run: npm run build
        env:
          VERSION: ci-${{ github.sha }}

      - name: Build native packages
        run: bin/release/package-native.sh
        env:
          VERSION: ci-${{ github.sha }}

      - name: Copy management HTML to distribution
        run: cp apps/web/dist/index.html dist/native/management.html

      - name: Upload native artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cpa-manager-plus-ci-${{ github.sha }}
          path: |
            dist/native/
          if-no-files-found: error
          retention-days: 7
