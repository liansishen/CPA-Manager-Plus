name: Temporary Native Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Artifact version label'
        required: true
        default: 'ci'
        type: string

permissions:
  contents: read

jobs:
  build-linux-amd64:
    name: Linux amd64 native package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.24.x'
          cache-dependency-path: apps/manager-server/go.sum

      - name: Install dependencies
        run: npm ci

      - name: Build management panel
        run: npm run build
        env:
          VERSION: ${{ inputs.version }}

      - name: Build native packages
        run: bin/release/package-native.sh
        env:
          VERSION: ${{ inputs.version }}

      - name: Upload Linux amd64 artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cpa-manager-plus-${{ inputs.version }}-linux-amd64
          path: |
            dist/native/cpa-manager-plus_${{ inputs.version }}_linux_amd64.tar.gz
            dist/native/checksums.txt
          if-no-files-found: error
          retention-days: 7
